<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>MQM · Sample Register</title>
<style>
:root {
  --red: #c8102e; --red-2: #9e0c24; --red-soft: #fdecee; --ink: #1b1b1f; --muted: #6e6e76; --line: #e7e5e2;
  --page: #f6f4f1; --card: #fff; --green: #2e9b4f; --amber: #e8a400; --bad: #d93a2b; --blue: #1f3864; --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; }
.hero { background: linear-gradient(135deg, var(--red), var(--red-2)); color: #fff; padding: 20px 18px 62px; }
.hero .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero .brand { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .22em; font-weight: 700; opacity: .9; }
.hero .brand svg { width: 28px; height: 18px; }
.hero .right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.hero h1 { margin: 10px 0 4px; font-size: 25px; font-weight: 800; }
.hero p { margin: 0; opacity: .85; font-size: 13.5px; }
.lang { display: inline-flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: none; color: #fff; font: inherit; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; cursor: pointer; opacity: .8; }
.lang button.on { background: #fff; color: var(--red); opacity: 1; }
.who { background: rgba(255,255,255,.16); border: 0; color: #fff; font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.wrap { max-width: 560px; margin: -44px auto 0; padding: 0 14px 120px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); }
.card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 15px; font-weight: 800; }
.card h2 .n { width: 26px; height: 26px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; font-size: 13px; }
.field { margin-bottom: 14px; } .field:last-child { margin-bottom: 0; }
.label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; }
.label .req { color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; min-width: 60px; }
.chip.on { background: var(--red); border-color: var(--red); color: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #f1efec; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 10px 6px; border-radius: 11px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
input, select { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); appearance: none; -webkit-appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 52%, calc(100% - 14px) 52%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input:focus, select:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
select:disabled { background-color: #f6f5f3; color: #aaa; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mt8 { margin-top: 8px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.btn { border: 0; background: var(--red); color: #fff; font: inherit; font-weight: 800; font-size: 16px; padding: 14px 22px; border-radius: 14px; cursor: pointer; }
.btn:disabled { opacity: .45; }
.btn.full { width: 100%; }
.btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { font-size: 13.5px; padding: 8px 14px; border-radius: 10px; }
.scanbox { position: relative; background: #111; border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3; display: grid; place-items: center; color: #fff; }
.scanbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanbox .aim { position: absolute; left: 10%; right: 10%; top: 34%; bottom: 34%; border: 3px solid rgba(255,255,255,.9); border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.scanbox .aim::after { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--red); box-shadow: 0 0 10px var(--red); animation: sweep 1.6s ease-in-out infinite; }
@keyframes sweep { 0%, 100% { transform: translateY(-26px); } 50% { transform: translateY(26px); } }
.scanbox .msg { position: relative; z-index: 2; text-align: center; padding: 18px; font-size: 14px; }
.scanbtn { width: 100%; border: 0; border-radius: 16px; background: var(--red); color: #fff; font: inherit; font-weight: 800; font-size: 18px; padding: 22px; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; }
.scanbtn svg { width: 30px; height: 30px; }
.manual { display: flex; gap: 8px; margin-top: 10px; } .manual input { flex: 1; } .manual .btn { padding: 0 18px; }
.prod { display: flex; gap: 12px; align-items: center; background: #f7f6f3; border-radius: 14px; padding: 12px; }
.prod .ic { width: 46px; height: 46px; border-radius: 12px; background: var(--red-soft); color: var(--red); display: grid; place-items: center; flex: none; font-weight: 900; }
.prod .pt { min-width: 0; flex: 1; }
.prod b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .prod small { color: var(--muted); font-size: 12px; letter-spacing: .03em; }
.skubox { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #f7f6f3; border-radius: 14px; padding: 14px 16px; }
.skubox b { font-size: 20px; } .skubox span { font-size: 11.5px; color: var(--muted); text-align: right; }
.dbox { border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
/* Ngày luôn hiện DD/MM/YYYY; ô chọn ngày của máy nằm phủ trong suốt lên cả dòng để bấm vào là mở lịch */
.drow { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; min-height: 54px; margin: 0; cursor: pointer; }
.drow + .drow { border-top: 1px solid var(--line); }
.drow > span { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.drow .dval { font-size: 17px; font-variant-numeric: tabular-nums; } .drow .dval.ph { color: #b5b2ad; font-weight: 600; }
.drow input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.drow:focus-within { background: var(--red-soft); }
.card h2 { margin-bottom: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #eef1f7; color: var(--blue); }
.tag.comp { background: #f4ecf8; color: #6d2f8e; } .tag.new { background: #fff4d6; color: #8a6300; }
.cands { display: grid; gap: 8px; } .cand { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; font: inherit; cursor: pointer; }
.cand.on { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.shot { width: 100%; border: 2px dashed #d9d6d1; background: #faf9f7; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; }
.shot svg { width: 34px; height: 34px; color: var(--red); } .shot small { font-weight: 400; color: var(--muted); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.photos div { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #eee center/cover; }
.photos button { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 1; cursor: pointer; }
.age { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #f1efec; }
.age i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; } .bar .msg { flex: 1; font-size: 12.5px; color: var(--muted); }
.recent .it { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; } .recent .it:first-of-type { border-top: 0; }
.recent .id { font-weight: 800; color: var(--red); min-width: 78px; } .recent .th { width: 38px; height: 38px; border-radius: 8px; background: #eee center/cover; flex: none; }
.recent h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
.done { position: fixed; inset: 0; background: rgba(20,20,24,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
.done.on { display: flex; }
.done .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 26px 20px calc(22px + env(safe-area-inset-bottom)); text-align: center; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.done .ok { width: 56px; height: 56px; border-radius: 50%; background: #e7f6ec; color: var(--green); display: grid; place-items: center; margin: 0 auto 10px; }
.done .code { font-size: 40px; font-weight: 900; letter-spacing: .04em; color: var(--red); margin: 6px 0; }
.done p { margin: 0 0 18px; color: var(--muted); } .done .btn { width: 100%; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
.toast.on { opacity: 1; }
.loading { text-align: center; color: var(--muted); padding: 28px 0; }
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<main class="wrap" id="app"><div class="card loading">…</div></main>
<div class="bar" id="bar" hidden><div class="in"><span class="msg" id="barMsg"></span><button class="btn" id="save" disabled></button></div></div>
<div class="done" id="done"><div class="sheet">
  <div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
  <div id="doneHead"></div><div class="code" id="doneCode"></div><p id="doneTxt"></p>
  <button class="btn" id="next"></button>
</div></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="cam" hidden>
<script>
// MQM 1A · Sample Register: đăng ký mẫu bằng quét barcode. Tên + bộ phận mua (nhớ) → quét → Brand / Vị / SKU tự ra → NSX, ngày mua, ảnh → lưu.
// Barcode ORION: barcodes.json (từ Rule.xlsx, cùng thư mục). Barcode học thêm (đối thủ…): tab Barcodes trong Google Sheet, qua Apps Script.
// Ghi vào cùng Google Sheet "MQM 1A - Đánh giá mẫu" như app Đăng ký mẫu cũ; gọi API không kèm tài khoản Google.
const API = 'https://script.google.com/macros/s/AKfycbySru5DIg7ESEnY11NISONQL9-uEPIaCzUIAil84mjowOEKeoO5jmV0GbDWkrR9rRp2/exec';
const KEY = '2vz3ylmgwosijd';
const ZXING = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const DEPTS = ['RD', 'MKT', 'FQS', 'Other'];

const OTHER = '__other__';
const I18N = {

    name: 'Tên người mua', namePh: 'VD: Nguyễn Văn A', dept: 'Bộ phận mua', deptOther: 'Nhập bộ phận', market: 'Thị trường', start: 'Bắt đầu quét', needSetup: 'Nhập tên và chọn bộ phận',
    scan: 'Quét barcode', scanning: 'Đưa barcode vào khung…', camErr: 'Không mở được camera. Cho phép camera trong trình duyệt, hoặc nhập barcode bên dưới.', stop: 'Dừng quét',

    secProduct: 'Sản phẩm', secDate: 'Ngày', mfd: 'Ngày sản xuất', buyDate: 'Ngày mua', secPhoto: 'Ảnh mẫu', shot: 'Chụp ảnh mẫu', shotHint: 'Mặt trước + chỗ in ngày sản xuất · tối đa 3 ảnh', delPhoto: 'Xoá ảnh',
    ageBad: 'NSX sau ngày mua, kiểm tra lại', age: d => `Tuổi sản phẩm ${d} ngày`,

    loadErr: e => `Không tải được danh mục: ${e}. Kiểm tra mạng rồi tải lại trang.`, loading: 'Đang tải danh mục…', learned: 'Đã ghi nhớ barcode mới',
    opt: { Other: 'Other', North: 'North', South: 'South', ORION: 'ORION', 'Đối thủ': 'Đối thủ' },

    back: '뒤로', sku: 'SKU (규격)', skuAuto: '바코드로 자동 인식', chooseSku: 'SKU 선택…', skuOther: '기타 SKU (직접 입력)…', skuPh: '예: 33g, Normal',
    secProduct: '제품', secDate: '날짜', mfd: '제조일', buyDate: '구매일', secPhoto: '샘플 사진', shot: '샘플 사진 촬영', shotHint: '앞면 + 제조일 인쇄 부분 · 최대 3장', delPhoto: '사진 삭제',

    doneHead: '등록 완료. 이 코드를 샘플 포장에 적으세요:', next: '다음 샘플 스캔', recent: '최근 등록', saveErr: '저장 실패: ',
    loadErr: e => `목록을 불러오지 못했습니다: ${e}. 네트워크 확인 후 새로고침하세요.`, loading: '목록을 불러오는 중…', learned: '새 바코드를 기억했습니다',

  },
};
let lang = (() => { try { return localStorage.getItem('mqm1a-lang') === 'ko' ? 'ko' : 'vi'; } catch (e) { return 'vi'; } })();
const T = k => I18N[lang][k];
const optL = v => I18N[lang].opt[v] || v;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dmy = d => { const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const uniq = a => [...new Set(a)];
let toastT;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };
const api = {
  get: q => fetch(`${API}?api=${q}&k=${KEY}`, { credentials: 'omit' }).then(r => r.json()),
  post: (name, data) => fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: name, k: KEY, data }) }).then(r => r.json()),
};
// Người mua: lưu trên máy (tên, bộ phận). Thị trường chọn theo từng mẫu, gợi sẵn thị trường của mẫu trước
let me = (() => { try { return JSON.parse(localStorage.getItem('mqm1a-scan-me')) || null; } catch (e) { return null; } })();
const saveMe = v => { me = v; try { localStorage.setItem('mqm1a-scan-me', JSON.stringify(v)); } catch (e) {} };
let lastMarket = (() => { try { return localStorage.getItem('mqm1a-scan-market') || ''; } catch (e) { return ''; } })();
let draft = { name: me ? me.name : '', dept: me ? me.dept : '', deptOther: me ? me.deptOther || '' : '' };

let products = [], staticCodes = {}, learnedCodes = {}, loaded = false, loadErr = '', view = me ? 'scan' : 'setup', recent = [];
let cur = null;   // mẫu đang nhập: {barcode, cands, pick, learn, market, origin, brand, flavor, flavorOther, sku, skuOther, mfd, buyDate, photos}
let scanning = false, stream = null, zxReader = null, scanTimer = null, lastHit = '', hitCount = 0;

const brandsOf = o => uniq(products.filter(p => p.origin === o).map(p => p.brand)).sort((a, b) => a.localeCompare(b));
const flavorsOf = b => uniq(products.filter(p => p.brand === b).map(p => p.flavor).filter(Boolean));
const skusOf = (b, fl) => uniq(products.filter(p => p.brand === b && p.flavor === fl).flatMap(p => String(p.sku || '').split(',')).map(s => s.trim()).filter(Boolean)).sort((x, y) => x.localeCompare(y, 'vi', { numeric: true }));
const catOf = (b, fl) => (products.find(p => p.brand === b && p.flavor === fl) || products.find(p => p.brand === b) || {}).cat || '';
const originOf = b => (products.find(p => p.brand === b) || {}).origin || '';
// Kiểm tra số kiểm tra EAN-8 / UPC-A / EAN-13 để tránh đọc nhầm
function validCode(c) {
  if (!/^\d{8,14}$/.test(c)) return false;
  if (![8, 12, 13].includes(c.length)) return true;
  const d = c.split('').map(Number), chk = d.pop(); let s = 0;
  d.reverse().forEach((x, i) => { s += x * (i % 2 === 0 ? 3 : 1); });
  return (10 - s % 10) % 10 === chk;
}
// Tra barcode: barcode đã học (Sheet) ưu tiên, sau đó danh mục ORION (barcodes.json); EAN-13 bắt đầu bằng 0 = UPC-A
function lookup(code) {
  const keys = [code, code.length === 13 && code[0] === '0' ? code.slice(1) : '', code.length === 12 ? '0' + code : ''].filter(Boolean);
  for (const k of keys) if (learnedCodes[k]) return { cands: [learnedCodes[k]], learned: true };
  for (const k of keys) if (staticCodes[k]) return { cands: staticCodes[k].map(([brand, flavor, sku, cat]) => ({ origin: 'ORION', brand, flavor, sku, cat })), learned: false };
  return { cands: [], learned: false };
}
function onCode(code) {
  code = String(code).replace(/\D/g, '');
  if (!validCode(code)) { toast(T('badCode')); return; }
  stopScan();
  const r = lookup(code);
  cur = { barcode: code, cands: r.cands, pick: r.cands.length === 1 ? 0 : -1, learn: r.cands.length !== 1, market: lastMarket, origin: 'ORION', brand: '', flavor: '', flavorOther: '', sku: '', skuOther: '', mfd: '', buyDate: today(), photos: [] };
  if (r.cands.length === 1) applyCand(0);
  if (navigator.vibrate) navigator.vibrate(60);
  view = 'form'; render(); scrollTo(0, 0);
}
function applyCand(i) {
  const c = cur.cands[i]; cur.pick = i;
  cur.origin = c.origin || originOf(c.brand) || 'ORION'; cur.brand = c.brand; cur.sku = String(c.sku || ''); cur.skuOther = '';
  const fl = flavorsOf(c.brand); cur.flavor = fl.includes(c.flavor) || !c.flavor ? c.flavor : OTHER; cur.flavorOther = cur.flavor === OTHER ? c.flavor : '';
  const sk = skusOf(c.brand, c.flavor); if (cur.sku && sk.length && !sk.includes(cur.sku)) { cur.skuOther = cur.sku; cur.sku = OTHER; } else if (!sk.length) { cur.skuOther = cur.sku; cur.sku = ''; }
  cur.cat = c.cat || catOf(c.brand, c.flavor);
}
const flavorVal = () => cur.flavor === OTHER ? cur.flavorOther.trim() : cur.flavor;
const skuVal = () => cur.sku === OTHER || !skusOf(cur.brand, cur.flavor).length ? cur.skuOther.trim() : cur.sku;

// ---------- Camera ----------
async function startScan() {
  scanning = true; lastHit = ''; hitCount = 0; render();
  const video = $('#video');
  try {
    if ('BarcodeDetector' in window) {
      const fmts = await BarcodeDetector.getSupportedFormats().catch(() => []);
      if (fmts.includes('ean_13')) {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
        video.srcObject = stream; await video.play();
        const det = new BarcodeDetector({ formats: fmts.filter(f => ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'].includes(f)) });
        const tick = async () => { if (!scanning) return; try { const r = await det.detect(video); if (r[0]) hit(r[0].rawValue); } catch (e) {} scanTimer = setTimeout(tick, 180); };
        tick(); return;
      }
    }
    if (!window.ZXing) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = ZXING; s.onload = res; s.onerror = () => rej(new Error('ZXing')); document.head.appendChild(s); });
    const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
    zxReader = new ZXing.BrowserMultiFormatReader(hints);
    await zxReader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } } }, video, res => { if (res && scanning) hit(res.getText()); });
  } catch (e) { scanning = false; stopScan(); render(); toast(T('camErr')); }
}
// Cùng 1 mã đọc 2 lần liên tiếp mới nhận (tránh đọc nhầm khi camera rung)
function hit(code) { if (code === lastHit) { if (++hitCount >= 1) onCode(code); } else { lastHit = code; hitCount = 0; } }
function stopScan() {
  scanning = false; clearTimeout(scanTimer);
  try { if (zxReader) zxReader.reset(); } catch (e) {}
  zxReader = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

// ---------- Giao diện ----------
function hero() {
  document.documentElement.lang = lang; document.title = 'MQM · ' + T('title');
  $('#hero').innerHTML = `<div class="top"><div class="brand"><svg viewBox="0 0 46 30" fill="#fff"><ellipse cx="13" cy="15" rx="12" ry="13"/><ellipse cx="33" cy="15" rx="12" ry="13"/><circle cx="16" cy="12" r="4" fill="#c8102e"/><circle cx="36" cy="12" r="4" fill="#c8102e"/></svg>${T('step')}</div>
    <div class="right"><div class="lang"><button data-lang="vi" class="${lang === 'vi' ? 'on' : ''}">VI</button><button data-lang="ko" class="${lang === 'ko' ? 'on' : ''}">한국어</button></div>
    ${me && view !== 'setup' ? `<button class="who" id="who">${esc(me.name)} · ${esc(me.dept === 'Other' ? me.deptOther : me.dept)} ▾</button>` : ''}
    ${view === 'form' || (view === 'setup' && me) ? `<button class="who" id="back">← ${T('back')}</button>` : ''}</div></div>
    <h1>${T('title')}</h1><p>${view === 'setup' ? T('subSetup') : view === 'form' ? T('subForm') : T('subScan')}</p>`;
  $('#next').textContent = T('next'); $('#doneHead').textContent = T('doneHead');
}
function viewSetup() {
  return `<div class="card">
    <div class="field"><span class="label">${T('name')} <span class="req">*</span></span><input id="nm" autocomplete="name" placeholder="${esc(T('namePh'))}" value="${esc(draft.name)}"></div>
    <div class="field"><span class="label">${T('dept')} <span class="req">*</span></span><div class="chips" id="dp">${DEPTS.map(d => `<button class="chip ${draft.dept === d ? 'on' : ''}" data-v="${d}">${esc(optL(d))}</button>`).join('')}</div>
      ${draft.dept === 'Other' ? `<input class="mt8" id="dpo" placeholder="${esc(T('deptOther'))}" value="${esc(draft.deptOther)}">` : ''}</div>
    <button class="btn full" id="go">${T('start')}</button></div>`;
}
function viewScan() {
  return `<div class="card"><div class="scanbox" id="scanbox">${scanning ? `<video id="video" playsinline muted></video><div class="aim"></div>` : `<video id="video" playsinline muted hidden></video><div class="msg">${T('subScan')}</div>`}</div>
    <div style="margin-top:12px">${scanning ? `<button class="btn ghost full" id="stop">${T('stop')}</button>` : `<button class="scanbtn" id="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>${T('scan')}</button>`}</div>
    <div class="manual"><input id="code" inputmode="numeric" placeholder="${esc(T('manualPh'))}"><button class="btn sm" id="look">${T('lookup')}</button></div></div>
    ${recent.length ? `<div class="card recent"><h3>${T('recent')}</h3>${recent.slice(0, 6).map(s => `<div class="it"><div class="th" style="${s.thumb ? `background-image:url(${s.thumb})` : ''}"></div><span class="id">${esc(s.id)}</span><span>${esc(s.brand)} · ${esc(s.flavor)}${s.sku ? ' · ' + esc(s.sku) : ''}</span></div>`).join('')}</div>` : ''}`;
}
function ageInfo() {
  if (!cur.mfd || !cur.buyDate) return '';
  const days = Math.round((new Date(cur.buyDate) - new Date(cur.mfd)) / 864e5);
  if (days < 0) return `<span class="age" style="background:#fdecee;color:var(--bad)">${T('ageBad')}</span>`;
  const c = FRESH[cur.cat || catOf(cur.brand, flavorVal())];
  const [txt, col] = !c ? ['', '#999'] : days < c[0] ? ['Green', 'var(--green)'] : days <= c[1] ? ['Yellow', 'var(--amber)'] : ['Red', 'var(--bad)'];
  return `<span class="age"><i style="background:${col}"></i>${T('age')(days)}${txt ? ' · ' + txt : ''}</span>`;
}
function productPicker() {
  const brands = brandsOf(cur.origin), flavors = flavorsOf(cur.brand);
  const opt = (v, l, c) => `<option value="${esc(v)}" ${v === c ? 'selected' : ''}>${esc(l)}</option>`;
  return `<div class="field mt8"><div class="seg" data-k="origin">${['ORION', 'Đối thủ'].map(o => `<button class="${cur.origin === o ? 'on' : ''}" data-v="${o}">${esc(optL(o))}</button>`).join('')}</div></div>
    <div class="field"><span class="label">${T('brand')} <span class="req">*</span></span><select data-k="brand"><option value="">${T('chooseBrand')}</option>${brands.map(b => opt(b, b, cur.brand)).join('')}</select></div>
    <div class="field"><span class="label">${T('flavor')} <span class="req">*</span></span><select data-k="flavor" ${cur.brand ? '' : 'disabled'}><option value="">${cur.brand ? T('chooseFlavor') : T('brandFirst')}</option>${flavors.map(x => opt(x, x, cur.flavor)).join('')}${cur.brand ? opt(OTHER, T('flavorOther'), cur.flavor) : ''}</select>
      ${cur.flavor === OTHER ? `<input class="mt8" data-k="flavorOther" placeholder="${esc(T('flavorPh'))}" value="${esc(cur.flavorOther)}">` : ''}</div>`;
}
// SKU (size): tự hiện khi barcode đã có SKU; không có thì chọn theo danh mục hoặc nhập tay
function skuField() {
  const skus = skusOf(cur.brand, cur.flavor), opt = (v, l, c) => `<option value="${esc(v)}" ${v === c ? 'selected' : ''}>${esc(l)}</option>`;
  return skus.length ? `<select data-k="sku" ${cur.brand ? '' : 'disabled'}><option value="">${T('chooseSku')}</option>${skus.map(x => opt(x, x, cur.sku)).join('')}${opt(OTHER, T('skuOther'), cur.sku)}</select>${cur.sku === OTHER ? `<input class="mt8" data-k="skuOther" placeholder="${esc(T('skuPh'))}" value="${esc(cur.skuOther)}">` : ''}`
    : `<input data-k="skuOther" placeholder="${esc(T('skuPh'))}" value="${esc(cur.skuOther)}" ${cur.brand ? '' : 'disabled'}>`;
}
// Sau khi quét: 1 Sản phẩm · 2 SKU · 3 Thị trường · 4 Ngày (NSX / ngày mua) · 5 Ảnh
function viewForm() {
  const ok = cur.pick >= 0 && !cur.editing, comp = cur.origin !== 'ORION';
  const sec = (n, title, body, req) => `<section class="card"><h2><span class="n">${n}</span>${title}${req ? ' <span class="req" style="color:var(--red)">*</span>' : ''}</h2>${body}</section>`;
  const card = ok ? `<div class="prod"><div class="ic">✓</div><div class="pt"><span class="tag ${comp ? 'comp' : ''}">${esc(optL(cur.origin))}</span><b>${esc(cur.brand)} · ${esc(flavorVal())}</b><small>${esc(cur.barcode)}</small></div></div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost sm" id="rescan">${T('rescan')}</button><button class="btn ghost sm" id="change">${T('change')}</button></div>` : '';
  const cands = cur.cands.length > 1 && !ok ? `<p class="hint" style="margin:0 0 8px">${T('many')}</p><div class="cands">${cur.cands.map((x, i) => `<button class="cand ${cur.pick === i ? 'on' : ''}" data-cand="${i}"><b>${esc(x.brand)} · ${esc(x.flavor)}</b><br><small>SKU ${esc(x.sku)}</small></button>`).join('')}</div>` : '';
  const unknown = !ok && (cur.cands.length === 0 || cur.editing) ? `${cur.cands.length === 0 ? `<p class="hint" style="margin:0"><span class="tag new">${esc(cur.barcode)}</span> ${T('unknown')}</p>` : ''}${productPicker()}<button class="btn ghost sm" id="rescan">${T('rescan')}</button>` : '';
  const sku = ok && skuVal() ? `<div class="skubox"><b>${esc(skuVal())}</b><span>${T('skuAuto')}</span></div>` : skuField();
  const market = `<div class="seg" id="mk">${['North', 'South'].map(m => `<button class="${cur.market === m ? 'on' : ''}" data-v="${m}">${esc(optL(m))}</button>`).join('')}</div>`;
  const dates = `<div class="dbox">
      <label class="drow"><span>${T('mfd')} <span class="req">*</span></span><b class="dval ${cur.mfd ? '' : 'ph'}">${cur.mfd ? dmy(cur.mfd) : 'DD/MM/YYYY'}</b><input type="date" data-k="mfd" value="${esc(cur.mfd)}" max="${esc(cur.buyDate || today())}"></label>
      <label class="drow"><span>${T('buyDate')} <span class="req">*</span></span><b class="dval ${cur.buyDate ? '' : 'ph'}">${cur.buyDate ? dmy(cur.buyDate) : 'DD/MM/YYYY'}</b><input type="date" data-k="buyDate" value="${esc(cur.buyDate)}" max="${today()}"></label></div>
      <div id="age">${ageInfo()}</div>`;
  return sec(1, T('secProduct'), card + cands + unknown) + sec(2, T('sku'), sku) + sec(3, T('market'), market, true) + sec(4, T('secDate'), dates, true)
    + `<section class="card"><h2><span class="n">5</span>${T('secPhoto')} <span class="req" style="color:var(--red)">*</span></h2>
      ${cur.photos.length < 3 ? `<button class="shot" id="shot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${T('shot')}<small>${T('shotHint')}</small></button>` : ''}
      <div class="photos">${cur.photos.map((p, i) => `<div style="background-image:url(${p})"><button data-del="${i}" aria-label="${T('delPhoto')}">×</button></div>`).join('')}</div></section>`;
}
function missing() {
  if (!cur) return ['?'];
  const m = [];
  if (!cur.brand || !flavorVal()) m.push(T('m_prod'));
  if (!cur.market) m.push(T('m_market'));
  if (!cur.mfd) m.push(T('m_mfd'));
  if (!cur.buyDate) m.push(T('m_buy'));
  if (!cur.photos.length) m.push(T('m_photo'));
  return m;
}
function status() {
  const m = missing(); $('#save').disabled = m.length > 0; $('#save').textContent = T('save');
  $('#barMsg').textContent = m.length ? T('missing') + m.join(', ') : T('ready');
}
function render() {
  hero();
  if (!loaded) { $('#app').innerHTML = `<div class="card loading">${loadErr ? esc(T('loadErr')(loadErr)) : T('loading')}</div>`; $('#bar').hidden = true; bindTop(); return; }
  $('#app').innerHTML = view === 'setup' ? viewSetup() : view === 'form' ? viewForm() : viewScan();
  $('#bar').hidden = view !== 'form';
  if (view === 'form') status();
  bindTop(); bind();
}
function bindTop() {
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('mqm1a-lang', lang); } catch (e) {} const y = scrollY; render(); scrollTo(0, y); });
  // Quay lại màn hình quét: từ trang mẫu thì bỏ mẫu đang nhập và mở camera quét lại
  const back = $('#back'); if (back) back.onclick = () => { const fromForm = view === 'form'; cur = null; view = 'scan'; render(); scrollTo(0, 0); if (fromForm) startScan(); };
  const who = $('#who'); if (who) who.onclick = () => { stopScan(); draft = { name: me.name, dept: me.dept, deptOther: me.deptOther || '' }; view = 'setup'; render(); };
}
function bind() {
  if (view === 'setup') {
    $('#nm').oninput = e => { draft.name = e.target.value; };
    document.querySelectorAll('#dp button').forEach(b => b.onclick = () => { draft.dept = b.dataset.v; render(); });
    const o = $('#dpo'); if (o) o.oninput = e => { draft.deptOther = e.target.value; };
    $('#go').onclick = () => {
      if (!draft.name.trim() || !draft.dept || (draft.dept === 'Other' && !draft.deptOther.trim())) return toast(T('needSetup'));
      saveMe({ name: draft.name.trim(), dept: draft.dept, deptOther: draft.deptOther.trim() }); view = 'scan'; render();
    };
    return;
  }
  if (view === 'scan') {
    const sc = $('#scan'); if (sc) sc.onclick = startScan;
    const st = $('#stop'); if (st) st.onclick = () => { stopScan(); render(); };
    const go = () => onCode($('#code').value); $('#look').onclick = go; $('#code').onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  document.querySelectorAll('[data-cand]').forEach(b => b.onclick = () => { applyCand(+b.dataset.cand); cur.learn = true; render(); });
  const rs = $('#rescan'); if (rs) rs.onclick = () => { cur = null; view = 'scan'; render(); startScan(); };
  document.querySelectorAll('#mk button').forEach(b => b.onclick = () => { cur.market = b.dataset.v; render(); });
  const ch = $('#change'); if (ch) ch.onclick = () => { cur.editing = true; cur.learn = true; render(); };
  document.querySelectorAll('#app [data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.classList.contains('seg')) el.querySelectorAll('button').forEach(b => b.onclick = () => { cur[k] = b.dataset.v; cur.brand = ''; cur.flavor = ''; cur.sku = ''; render(); });
    else if (el.tagName === 'SELECT') el.onchange = () => { cur[k] = el.value; if (k === 'brand') { cur.flavor = ''; cur.sku = ''; } if (k === 'flavor') cur.sku = ''; cur.cat = catOf(cur.brand, flavorVal()); render(); };
    else if (el.type === 'date') { el.onchange = () => { cur[k] = el.value; render(); }; el.onclick = () => { try { el.showPicker(); } catch (e) {} }; }
    else el.oninput = () => { cur[k] = el.value; status(); };
  });
  const shot = $('#shot'); if (shot) shot.onclick = () => $('#cam').click();
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { cur.photos.splice(+b.dataset.del, 1); render(); });
}
const shrink = (src, max, q) => new Promise(res => { const im = new Image(); im.onload = () => {
  const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  res(c.toDataURL('image/jpeg', q)); }; im.src = src; });
$('#cam').onchange = e => { const file = e.target.files[0]; e.target.value = ''; if (!file || !cur) return; const fr = new FileReader(); fr.onload = async () => { cur.photos.push(await shrink(fr.result, 1280, 0.75)); render(); }; fr.readAsDataURL(file); };
$('#save').onclick = async () => {
  if (missing().length) return;
  const b = $('#save'); b.disabled = true; b.textContent = T('saving');
  try {
    const data = { buyerName: me.name, buyerDept: me.dept, buyerOther: me.deptOther, market: cur.market, buyDate: cur.buyDate, origin: cur.origin, brand: cur.brand, flavor: flavorVal(), sku: skuVal(),
      cat: cur.cat || catOf(cur.brand, flavorVal()), barcode: cur.barcode, learn: !!cur.learn, mfd: cur.mfd, qty: 1, photosFull: cur.photos, thumb: cur.photos[0] ? await shrink(cur.photos[0], 320, 0.6) : '' };
    const r = await api.post('addSample', data);
    if (!r.ok) throw new Error(r.error || '?');
    lastMarket = data.market; try { localStorage.setItem('mqm1a-scan-market', lastMarket); } catch (e) {}
    if (data.learn) { learnedCodes[data.barcode] = { origin: data.origin, brand: data.brand, flavor: data.flavor, sku: data.sku, cat: data.cat }; toast(T('learned')); }
    recent.unshift({ ...r.sample, thumb: data.thumb });
    $('#doneCode').textContent = r.sample.id;
    $('#doneTxt').textContent = `${r.sample.brand} · ${r.sample.flavor}${r.sample.sku ? ' · ' + r.sample.sku : ''} · ${dmy(r.sample.mfd)}`;
    $('#done').classList.add('on');
  } catch (err) { toast(T('saveErr') + err.message); }
  status();
};
$('#next').onclick = () => { $('#done').classList.remove('on'); cur = null; view = 'scan'; render(); scrollTo(0, 0); startScan(); };
(async () => {
  render();
  try {
    const [c, s, bl] = await Promise.all([api.get('catalog'), fetch('barcodes.json', { cache: 'no-cache' }).then(r => r.json()), api.get('barcodes').catch(() => ({ barcodes: [] }))]);
    if (!c.ok) throw new Error(c.error);
    products = c.products; staticCodes = s.items || {};
    (bl.barcodes || []).forEach(x => { learnedCodes[String(x.barcode)] = x; });
    loaded = true;
  } catch (err) { loadErr = err.message; }
  render();
})();
</script>
</body>
