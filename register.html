<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>MQM · Đăng ký mẫu</title>
<style>
:root {
  --red: #c8102e; --red-2: #9e0c24; --red-soft: #fdecee; --ink: #1b1b1f; --muted: #6e6e76; --line: #e7e5e2;
  --page: #f6f4f1; --card: #fff; --green: #2e9b4f; --amber: #e8a400; --bad: #d93a2b; --blue: #1f3864; --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; }
.hero { background: linear-gradient(135deg, var(--red), var(--red-2)); color: #fff; padding: 22px 18px 70px; }
.hero .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero .brand { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .22em; font-weight: 700; opacity: .9; }
.hero .brand svg { width: 28px; height: 18px; }
.hero h1 { margin: 10px 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.hero p { margin: 0; opacity: .85; font-size: 13.5px; }
.lang { display: inline-flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: none; color: #fff; font: inherit; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; cursor: pointer; opacity: .8; }
.lang button.on { background: #fff; color: var(--red); opacity: 1; }
.wrap { max-width: 560px; margin: -52px auto 0; padding: 0 14px 120px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: rgba(255,255,255,.18); padding: 4px; border-radius: 14px; margin-bottom: 12px; backdrop-filter: blur(6px); }
.tabs button { border: 0; background: none; color: #fff; font: inherit; font-weight: 700; padding: 10px; border-radius: 11px; cursor: pointer; }
.tabs button.on { background: #fff; color: var(--red); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); }
.card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 15px; font-weight: 800; }
.card h2 .n { width: 26px; height: 26px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; font-size: 13px; }
.editing { background: #fff8e6; border: 1.5px solid #f3d27a; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.editing b { color: var(--red); }
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; }
.label .req { color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; min-width: 64px; }
.chip.on { background: var(--red); border-color: var(--red); color: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #f1efec; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 10px 6px; border-radius: 11px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
input, select { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); appearance: none; -webkit-appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 52%, calc(100% - 14px) 52%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input:focus, select:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
select:disabled, input:disabled { background-color: #f6f5f3; color: #aaa; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mt8 { margin-top: 8px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.age { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #f1efec; }
.age i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper button { width: 48px; height: 46px; border: 0; background: #f6f5f3; font-size: 22px; font-weight: 700; color: var(--ink); cursor: pointer; }
.stepper input { border: 0; border-radius: 0; text-align: center; font-weight: 800; }
.stepper input:focus { box-shadow: none; }
.shot { width: 100%; border: 2px dashed #d9d6d1; background: #faf9f7; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; }
.shot svg { width: 34px; height: 34px; color: var(--red); }
.shot small { font-weight: 400; color: var(--muted); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.photos div { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #eee center/cover; }
.photos button { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 1; cursor: pointer; }
.photos .old::after { content: attr(data-l); position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; text-align: center; padding: 3px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.bar .msg { flex: 1; font-size: 12.5px; color: var(--muted); }
.btn { border: 0; background: var(--red); color: #fff; font: inherit; font-weight: 800; font-size: 16px; padding: 14px 22px; border-radius: 14px; cursor: pointer; }
.btn:disabled { opacity: .45; }
.btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { font-size: 13.5px; padding: 8px 14px; border-radius: 10px; }
.tools { display: flex; gap: 8px; margin-bottom: 10px; }
.tools input { padding: 10px 14px; }
.stat { font-size: 13px; color: var(--muted); margin: 0 2px 10px; }
.it { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: #fff; border-radius: 16px; padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.it .th { width: 56px; height: 56px; border-radius: 12px; background: #eeece8 center/cover; display: grid; place-items: center; color: #aaa; font-size: 10px; }
.it .id { font-size: 12px; font-weight: 800; color: var(--red); }
.it b { display: block; font-size: 14.5px; }
.it small { color: var(--muted); font-size: 12px; display: block; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #eef1f7; color: var(--blue); }
.tag.comp { background: #f4ecf8; color: #6d2f8e; }
.done { position: fixed; inset: 0; background: rgba(20,20,24,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
.done.on { display: flex; }
.done .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 26px 20px calc(22px + env(safe-area-inset-bottom)); text-align: center; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.done .ok { width: 56px; height: 56px; border-radius: 50%; background: #e7f6ec; color: var(--green); display: grid; place-items: center; margin: 0 auto 10px; }
.done .code { font-size: 40px; font-weight: 900; letter-spacing: .04em; color: var(--red); margin: 6px 0; }
.done p { margin: 0 0 18px; color: var(--muted); }
.done .btns { display: grid; gap: 8px; }
.done .btn { width: 100%; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
.toast.on { opacity: 1; }
.loading { text-align: center; color: var(--muted); padding: 28px 0; }
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<main class="wrap"><nav class="tabs" id="tabs"></nav><div id="app"><div class="card loading">…</div></div></main>
<div class="bar" id="bar"><div class="in"><span class="msg" id="barMsg"></span><button class="btn" id="save" disabled></button></div></div>
<div class="done" id="done"><div class="sheet">
  <div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
  <div id="doneHead"></div>
  <div class="code" id="doneCode"></div>
  <p id="doneTxt"></p>
  <div class="btns"><button class="btn" id="next"></button><button class="btn ghost" id="review"></button></div>
</div></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="cam" hidden>
<script>
// MQM 1A · App đăng ký mẫu. Dữ liệu ghi vào Google Sheet "MQM 1A - Đánh giá mẫu" qua Apps Script (Api.gs).
// Gọi API không kèm tài khoản Google nên ai cũng dùng được, kể cả máy đăng nhập nhiều tài khoản.
// Tab "Đã đăng ký": xem lại và sửa mẫu đã gửi (mã mẫu giữ nguyên). Nút VI / 한국어 chỉ đổi chữ hiển thị;
// giá trị ghi vào Sheet giữ nguyên (North/South, ORION/Đối thủ, RD/MKT/FQS/Other) để bảng tổng hợp không lẫn 2 thứ tiếng.
const API = 'https://script.google.com/macros/s/AKfycbySru5DIg7ESEnY11NISONQL9-uEPIaCzUIAil84mjowOEKeoO5jmV0GbDWkrR9rRp2/exec';
const KEY = '2vz3ylmgwosijd';
const BUYERS = ['RD', 'MKT', 'FQS', 'Other'];
const FRESH = { L: [90, 180], M: [75, 135], S8: [60, 90], S6: [45, 90] };   // chuẩn freshness theo CAT (ngày)
const OTHER = '__other__';
const I18N = {
  vi: {
    step: 'MQM · BƯỚC 1A', title: 'Đăng ký mẫu', sub: 'Nhập từng gói mẫu vừa mua. Sau khi lưu, hệ thống cấp mã mẫu để ghi lên gói. Gửi sai vẫn sửa lại được.',
    tabNew: 'Đăng ký mới', tabEdit: id => `Đang sửa ${id}`, tabList: n => `Đã đăng ký (${n})`, loadingCat: 'Đang tải danh mục sản phẩm…',
    editing: id => `Đang sửa mẫu <b>${id}</b>. Mã mẫu giữ nguyên.`, cancelEdit: 'Huỷ sửa',
    secBuyer: 'Người mua', buyer: 'Người mua', buyerOther: 'Nhập tên người mua / bộ phận', buyDate: 'Ngày mua', market: 'Thị trường',
    secProduct: 'Sản phẩm', brand: 'Brand', chooseBrand: 'Chọn brand…', flavor: 'Vị', chooseFlavor: 'Chọn vị…', brandFirst: 'Chọn brand trước',
    flavorOther: 'Vị khác (nhập tay)…', flavorOtherPh: 'Nhập tên vị', sku: 'SKU (size)', chooseSku: 'Chọn SKU…', skuOther: 'SKU khác (nhập tay)…',
    skuPh: 'VD: 33g, hộp 12 cái', noSku: 'Chưa có danh mục SKU cho sản phẩm này, nhập tay.',
    secDate: 'Date', mfd: 'Ngày sản xuất', qty: 'Số gói', less: 'Bớt', more: 'Thêm',
    ageBad: 'NSX sau ngày mua, kiểm tra lại', age: d => `Tuổi sản phẩm ${d} ngày`,
    secPhoto: 'Ảnh', shot: 'Chụp ảnh gói mẫu', reshoot: 'Chụp lại ảnh (thay ảnh cũ)', shotHint: 'Mặt trước + chỗ in ngày sản xuất · tối đa 3 ảnh', oldPhoto: 'Ảnh đã lưu', delPhoto: 'Xoá ảnh',
    search: 'Tìm mã mẫu, brand, vị, người mua…', listStat: n => `${n} mẫu đã đăng ký · bấm Sửa nếu cần chỉnh lại`, edit: 'Sửa', noPhoto: 'không ảnh',
    noMatch: 'Không có mẫu khớp.', noSample: 'Chưa có mẫu nào.', mfdShort: 'NSX', buyShort: 'mua', packs: n => `${n} gói`,
    missing: 'Còn thiếu: ', ready: 'Sẵn sàng đăng ký', readyEdit: 'Sẵn sàng lưu thay đổi', save: 'Đăng ký mẫu', saveEdit: 'Lưu thay đổi', saving: 'Đang lưu…',
    m_buyer: 'người mua', m_buyDate: 'ngày mua', m_market: 'thị trường', m_brand: 'brand', m_flavor: 'vị', m_mfd: 'NSX',
    doneNew: 'Đã đăng ký. Ghi mã này lên gói mẫu:', doneEdit: 'Đã lưu thay đổi cho mẫu:', next: 'Đăng ký mẫu tiếp theo', review: 'Xem / sửa mẫu vừa gửi', reviewEdit: 'Sửa tiếp mẫu này',
    saveErr: 'Chưa lưu được: ', loadErr: e => `Không tải được danh mục: ${e}. Kiểm tra mạng rồi tải lại trang.`,
    opt: { Other: 'Other', North: 'North', South: 'South', ORION: 'ORION', 'Đối thủ': 'Đối thủ' },
  },
  ko: {
    step: 'MQM · 1A 단계', title: '샘플 등록', sub: '구매한 샘플을 한 개씩 입력하세요. 저장하면 샘플 코드가 발급되며 포장에 기재합니다. 잘못 입력해도 수정할 수 있습니다.',
    tabNew: '신규 등록', tabEdit: id => `${id} 수정 중`, tabList: n => `등록 목록 (${n})`, loadingCat: '제품 목록을 불러오는 중…',
    editing: id => `샘플 <b>${id}</b> 수정 중. 샘플 코드는 유지됩니다.`, cancelEdit: '수정 취소',
    secBuyer: '구매자', buyer: '구매자', buyerOther: '구매자 / 부서 입력', buyDate: '구매일', market: '시장',
    secProduct: '제품', brand: '브랜드', chooseBrand: '브랜드 선택…', flavor: '맛', chooseFlavor: '맛 선택…', brandFirst: '먼저 브랜드를 선택하세요',
    flavorOther: '기타 맛 (직접 입력)…', flavorOtherPh: '맛 이름 입력', sku: 'SKU (규격)', chooseSku: 'SKU 선택…', skuOther: '기타 SKU (직접 입력)…',
    skuPh: '예: 33g, 12개입', noSku: '이 제품은 SKU 목록이 없어 직접 입력합니다.',
    secDate: '날짜', mfd: '제조일', qty: '수량', less: '빼기', more: '더하기',
    ageBad: '제조일이 구매일보다 늦습니다. 확인하세요', age: d => `제품 나이 ${d}일`,
    secPhoto: '사진', shot: '샘플 사진 촬영', reshoot: '사진 다시 촬영 (기존 사진 교체)', shotHint: '앞면 + 제조일 인쇄 부분 · 최대 3장', oldPhoto: '저장된 사진', delPhoto: '사진 삭제',
    search: '샘플 코드, 브랜드, 맛, 구매자 검색…', listStat: n => `등록된 샘플 ${n}개 · 수정이 필요하면 '수정'을 누르세요`, edit: '수정', noPhoto: '사진 없음',
    noMatch: '일치하는 샘플이 없습니다.', noSample: '등록된 샘플이 없습니다.', mfdShort: '제조', buyShort: '구매', packs: n => `${n}개`,
    missing: '미입력: ', ready: '등록 준비 완료', readyEdit: '변경 저장 준비 완료', save: '샘플 등록', saveEdit: '변경 저장', saving: '저장 중…',
    m_buyer: '구매자', m_buyDate: '구매일', m_market: '시장', m_brand: '브랜드', m_flavor: '맛', m_mfd: '제조일',
    doneNew: '등록 완료. 이 코드를 샘플 포장에 적으세요:', doneEdit: '샘플 변경 저장 완료:', next: '다음 샘플 등록', review: '방금 등록한 샘플 보기 / 수정', reviewEdit: '이 샘플 계속 수정',
    saveErr: '저장 실패: ', loadErr: e => `목록을 불러오지 못했습니다: ${e}. 네트워크 확인 후 새로고침하세요.`,
    opt: { Other: '기타', North: '북부', South: '남부', ORION: 'ORION', 'Đối thủ': '경쟁사' },
  },
};
let lang = (() => { try { return localStorage.getItem('mqm1a-lang') === 'ko' ? 'ko' : 'vi'; } catch (e) { return 'vi'; } })();
const T = k => I18N[lang][k];
const optL = v => I18N[lang].opt[v] || v;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dmy = d => { const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]}/${+m[2]}/${m[1]}` : ''; };
const uniq = a => [...new Set(a)];
let toastT;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };
const api = {
  get: q => fetch(`${API}?api=${q}&k=${KEY}`, { credentials: 'omit' }).then(r => r.json()),
  post: (name, data) => fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ api: name, k: KEY, data }) }).then(r => r.json()),
};
const remember = (() => { try { return JSON.parse(localStorage.getItem('mqm1a-buyer')) || {}; } catch (e) { return {}; } })();
const keep = () => { if (editId) return; try { localStorage.setItem('mqm1a-buyer', JSON.stringify({ buyerDept: f.buyerDept, buyerOther: f.buyerOther, market: f.market })); } catch (e) {} };

let products = [], samples = [], loaded = false, loadErr = '', view = 'form', editId = null, oldThumb = '', lastId = null, lastEdit = false, filt = '';
const blank = () => ({ buyerDept: remember.buyerDept || '', buyerOther: remember.buyerOther || '', buyDate: today(), market: remember.market || '',
  origin: 'ORION', brand: '', flavor: '', flavorOther: '', sku: '', skuOther: '', mfd: '', qty: 1, photos: [] });
let f = blank();

const brandsOf = o => uniq(products.filter(p => p.origin === o).map(p => p.brand)).sort((a, b) => a.localeCompare(b));
const flavorsOf = b => uniq(products.filter(p => p.brand === b).map(p => p.flavor).filter(Boolean));
// Ô sku trong tab Products có thể chứa nhiều size cách nhau dấu phẩy (VD "Big, Normal, Small"); xếp theo số: 2P, 6P, 12P…
const skusOf = (b, fl) => uniq(products.filter(p => p.brand === b && p.flavor === fl).flatMap(p => String(p.sku || '').split(',')).map(s => s.trim()).filter(Boolean))
  .sort((x, y) => x.localeCompare(y, 'vi', { numeric: true }));
const catOf = (b, fl) => (products.find(p => p.brand === b && p.flavor === fl) || products.find(p => p.brand === b) || {}).cat || '';
const flavorVal = () => f.flavor === OTHER ? f.flavorOther.trim() : f.flavor;
const skuVal = () => f.sku === OTHER || !skusOf(f.brand, f.flavor).length ? f.skuOther.trim() : f.sku;

function ageInfo() {
  if (!f.mfd || !f.buyDate) return '';
  const days = Math.round((new Date(f.buyDate) - new Date(f.mfd)) / 864e5);
  if (days < 0) return `<span class="age" style="background:#fdecee;color:var(--bad)">${T('ageBad')}</span>`;
  const c = FRESH[catOf(f.brand, flavorVal())];
  const [txt, col] = !c ? ['', '#999'] : days < c[0] ? ['Green', 'var(--green)'] : days <= c[1] ? ['Yellow', 'var(--amber)'] : ['Red', 'var(--bad)'];
  return `<span class="age"><i style="background:${col}"></i>${T('age')(days)}${txt ? ' · ' + txt : ''}</span>`;
}
function missing() {
  const m = [];
  if (!f.buyerDept || (f.buyerDept === 'Other' && !f.buyerOther.trim())) m.push(T('m_buyer'));
  if (!f.buyDate) m.push(T('m_buyDate'));
  if (!f.market) m.push(T('m_market'));
  if (!f.brand) m.push(T('m_brand'));
  if (!flavorVal()) m.push(T('m_flavor'));
  if (!f.mfd) m.push(T('m_mfd'));
  return m;
}
function hero() {
  document.documentElement.lang = lang;
  document.title = 'MQM · ' + T('title');
  $('#hero').innerHTML = `<div class="top"><div class="brand"><svg viewBox="0 0 46 30" fill="#fff"><ellipse cx="13" cy="15" rx="12" ry="13"/><ellipse cx="33" cy="15" rx="12" ry="13"/><circle cx="16" cy="12" r="4" fill="#c8102e"/><circle cx="36" cy="12" r="4" fill="#c8102e"/></svg>${T('step')}</div>
    <div class="lang"><button data-lang="vi" class="${lang === 'vi' ? 'on' : ''}">VI</button><button data-lang="ko" class="${lang === 'ko' ? 'on' : ''}">한국어</button></div></div>
    <h1>${T('title')}</h1><p>${T('sub')}</p>`;
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('mqm1a-lang', lang); } catch (e) {} render(); });
  $('#next').textContent = T('next');
}
function tabs() {
  $('#tabs').innerHTML = `<button class="${view === 'form' ? 'on' : ''}" data-view="form">${editId ? T('tabEdit')(esc(editId)) : T('tabNew')}</button><button class="${view === 'list' ? 'on' : ''}" data-view="list">${T('tabList')(samples.length)}</button>`;
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { view = b.dataset.view; render(); scrollTo(0, 0); });
}
function viewForm() {
  const brands = brandsOf(f.origin), flavors = flavorsOf(f.brand), skus = skusOf(f.brand, f.flavor);
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
  return `${editId ? `<section class="card editing"><span>${T('editing')(esc(editId))}</span><button class="btn ghost sm" id="cancelEdit">${T('cancelEdit')}</button></section>` : ''}
  <section class="card"><h2><span class="n">1</span>${T('secBuyer')}</h2>
    <div class="field"><span class="label">${T('buyer')} <span class="req">*</span></span>
      <div class="chips" data-k="buyerDept">${BUYERS.map(b => `<button class="chip ${f.buyerDept === b ? 'on' : ''}" data-v="${b}">${esc(optL(b))}</button>`).join('')}</div>
      ${f.buyerDept === 'Other' ? `<input class="mt8" data-k="buyerOther" placeholder="${esc(T('buyerOther'))}" value="${esc(f.buyerOther)}">` : ''}</div>
    <div class="row2">
      <div class="field"><span class="label">${T('buyDate')} <span class="req">*</span></span><input type="date" data-k="buyDate" value="${esc(f.buyDate)}" max="${today()}"></div>
      <div class="field"><span class="label">${T('market')} <span class="req">*</span></span>
        <div class="seg" data-k="market">${['North', 'South'].map(m => `<button class="${f.market === m ? 'on' : ''}" data-v="${m}">${esc(optL(m))}</button>`).join('')}</div></div>
    </div></section>
  <section class="card"><h2><span class="n">2</span>${T('secProduct')}</h2>
    <div class="field"><div class="seg" data-k="origin">${['ORION', 'Đối thủ'].map(o => `<button class="${f.origin === o ? 'on' : ''}" data-v="${o}">${esc(optL(o))}</button>`).join('')}</div></div>
    <div class="field"><span class="label">${T('brand')} <span class="req">*</span></span>
      <select data-k="brand"><option value="">${T('chooseBrand')}</option>${brands.map(b => opt(b, b, f.brand)).join('')}</select></div>
    <div class="field"><span class="label">${T('flavor')} <span class="req">*</span></span>
      <select data-k="flavor" ${f.brand ? '' : 'disabled'}><option value="">${f.brand ? T('chooseFlavor') : T('brandFirst')}</option>${flavors.map(x => opt(x, x, f.flavor)).join('')}${f.brand ? opt(OTHER, T('flavorOther'), f.flavor) : ''}</select>
      ${f.flavor === OTHER ? `<input class="mt8" data-k="flavorOther" placeholder="${esc(T('flavorOtherPh'))}" value="${esc(f.flavorOther)}">` : ''}</div>
    <div class="field"><span class="label">${T('sku')}</span>
      ${skus.length ? `<select data-k="sku"><option value="">${T('chooseSku')}</option>${skus.map(x => opt(x, x, f.sku)).join('')}${opt(OTHER, T('skuOther'), f.sku)}</select>
        ${f.sku === OTHER ? `<input class="mt8" data-k="skuOther" placeholder="${esc(T('skuPh'))}" value="${esc(f.skuOther)}">` : ''}`
      : `<input data-k="skuOther" placeholder="${esc(T('skuPh'))}" value="${esc(f.skuOther)}" ${f.brand ? '' : 'disabled'}><div class="hint">${T('noSku')}</div>`}</div>
  </section>
  <section class="card"><h2><span class="n">3</span>${T('secDate')}</h2>
    <div class="row2">
      <div class="field"><span class="label">${T('mfd')} <span class="req">*</span></span><input type="date" data-k="mfd" value="${esc(f.mfd)}" max="${esc(f.buyDate || today())}"></div>
      <div class="field"><span class="label">${T('qty')}</span>
        <div class="stepper"><button data-step="-1" aria-label="${T('less')}">−</button><input type="number" inputmode="numeric" min="1" data-k="qty" value="${esc(f.qty)}"><button data-step="1" aria-label="${T('more')}">+</button></div></div>
    </div>
    <div id="age">${ageInfo()}</div></section>
  <section class="card"><h2><span class="n">4</span>${T('secPhoto')}</h2>
    ${f.photos.length < 3 ? `<button class="shot" id="shot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${editId && oldThumb ? T('reshoot') : T('shot')}<small>${T('shotHint')}</small></button>` : ''}
    <div class="photos">${editId && oldThumb && !f.photos.length ? `<div class="old" data-l="${esc(T('oldPhoto'))}" style="background-image:url(${oldThumb})"></div>` : ''}${f.photos.map((p, i) => `<div style="background-image:url(${p})"><button data-del="${i}" aria-label="${T('delPhoto')}">×</button></div>`).join('')}</div></section>`;
}
function viewList() {
  let xs = samples.slice().reverse();
  if (filt) { const q = filt.toLowerCase(); xs = xs.filter(s => `${s.id} ${s.brand} ${s.flavor} ${s.sku} ${s.buyer}`.toLowerCase().includes(q)); }
  return `<div class="tools"><input id="q" placeholder="${esc(T('search'))}" value="${esc(filt)}"></div>
    <p class="stat">${T('listStat')(samples.length)}</p>
    ${xs.length ? xs.map(s => `<div class="it"><div class="th" style="${s.thumb ? `background-image:url(${s.thumb})` : ''}">${s.thumb ? '' : T('noPhoto')}</div>
      <div><span class="id">${esc(s.id)}</span> <span class="tag ${s.origin === 'ORION' ? '' : 'comp'}">${esc(optL(s.origin || ''))}</span><b>${esc(s.brand)} · ${esc(s.flavor)}${s.sku ? ' · ' + esc(s.sku) : ''}</b>
        <small>${T('mfdShort')} ${dmy(s.mfd)} · ${T('buyShort')} ${dmy(s.buyDate)} · ${esc(optL(s.market))} · ${esc(s.buyer)}${s.qty ? ' · ' + T('packs')(esc(s.qty)) : ''}</small></div>
      <button class="btn ghost sm" data-edit="${esc(s.id)}">${T('edit')}</button></div>`).join('')
    : `<div class="card loading">${samples.length ? T('noMatch') : T('noSample')}</div>`}`;
}
function render() {
  hero(); tabs();
  if (!loaded) { $('#app').innerHTML = `<div class="card loading">${loadErr ? esc(T('loadErr')(loadErr)) : T('loadingCat')}</div>`; $('#bar').hidden = true; return; }
  $('#app').innerHTML = view === 'list' ? viewList() : viewForm();
  $('#bar').hidden = view === 'list';
  $('#save').textContent = editId ? T('saveEdit') : T('save');
  $('#doneHead').textContent = lastEdit ? T('doneEdit') : T('doneNew');
  $('#review').textContent = lastEdit ? T('reviewEdit') : T('review');
  bind(); status();
}
function status() {
  const m = missing();
  $('#save').disabled = m.length > 0;
  $('#barMsg').textContent = m.length ? T('missing') + m.join(', ') : editId ? T('readyEdit') : T('ready');
}
function bind() {
  if (view === 'list') {
    const q = $('#q'); q.oninput = () => { filt = q.value; const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => startEdit(b.dataset.edit));
    return;
  }
  document.querySelectorAll('#app [data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.classList.contains('chips') || el.classList.contains('seg')) {
      el.querySelectorAll('button').forEach(b => b.onclick = () => {
        f[k] = b.dataset.v;
        if (k === 'origin') { f.brand = ''; f.flavor = ''; f.sku = ''; }
        keep(); render();
      });
    } else if (el.tagName === 'SELECT') {
      el.onchange = () => { f[k] = el.value; if (k === 'brand') { f.flavor = ''; f.sku = ''; } if (k === 'flavor') f.sku = ''; render(); };
    } else {
      el.oninput = () => { f[k] = k === 'qty' ? Math.max(1, parseInt(el.value) || 1) : el.value; if (k === 'buyerOther') keep(); if (k === 'mfd' || k === 'buyDate') $('#age').innerHTML = ageInfo(); status(); };
      if (el.type === 'date') el.onchange = () => { f[k] = el.value; render(); };
    }
  });
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { f.qty = Math.max(1, (+f.qty || 1) + +b.dataset.step); render(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { f.photos.splice(+b.dataset.del, 1); render(); });
  const shot = $('#shot'); if (shot) shot.onclick = () => $('#cam').click();
  const cancel = $('#cancelEdit'); if (cancel) cancel.onclick = () => { editId = null; oldThumb = ''; f = blank(); view = 'list'; render(); };
}
// Mở mẫu đã gửi vào form để sửa: vị / SKU không có trong danh mục thì chuyển sang ô nhập tay
function startEdit(id) {
  const s = samples.find(x => x.id === id); if (!s) return;
  const dept = BUYERS.includes(s.buyerDept) ? s.buyerDept : 'Other';
  const origin = s.origin === 'Đối thủ' ? 'Đối thủ' : 'ORION';
  const inFl = flavorsOf(s.brand).includes(s.flavor), skus = skusOf(s.brand, s.flavor), inSku = skus.includes(String(s.sku || ''));
  f = { buyerDept: dept, buyerOther: dept === 'Other' ? s.buyer : '', buyDate: s.buyDate, market: s.market, origin, brand: s.brand,
    flavor: inFl ? s.flavor : OTHER, flavorOther: inFl ? '' : s.flavor,
    sku: skus.length ? (inSku ? String(s.sku) : (s.sku ? OTHER : '')) : '', skuOther: skus.length && inSku ? '' : String(s.sku || ''),
    mfd: s.mfd, qty: s.qty || 1, photos: [] };
  editId = id; oldThumb = s.thumb || ''; view = 'form'; render(); scrollTo(0, 0);
}
// Ảnh: thu nhỏ cạnh dài 1280px (bản lưu Drive) và 320px (ảnh nhỏ trong Sheet)
const shrink = (src, max, q) => new Promise(res => { const im = new Image(); im.onload = () => {
  const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  res(c.toDataURL('image/jpeg', q)); }; im.src = src; });
$('#cam').onchange = e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  const fr = new FileReader(); fr.onload = async () => { f.photos.push(await shrink(fr.result, 1280, 0.75)); render(); }; fr.readAsDataURL(file);
};
$('#save').onclick = async () => {
  if (missing().length) return;
  const b = $('#save'), editing = editId; b.disabled = true; b.textContent = T('saving');
  try {
    const data = { id: editing || undefined, buyerDept: f.buyerDept, buyerOther: f.buyerOther, buyDate: f.buyDate, market: f.market, brand: f.brand, flavor: flavorVal(), sku: skuVal(),
      mfd: f.mfd, qty: f.qty, photosFull: f.photos, thumb: f.photos[0] ? await shrink(f.photos[0], 320, 0.6) : '' };
    const r = await api.post(editing ? 'updateSample' : 'addSample', data);
    if (!r.ok) throw new Error(r.error || '?');
    const s = { ...r.sample, thumb: data.thumb || (editing ? oldThumb : '') };
    const i = samples.findIndex(x => x.id === s.id); i >= 0 ? samples.splice(i, 1, s) : samples.push(s);
    lastId = s.id; lastEdit = !!editing;
    $('#doneCode').textContent = s.id;
    $('#doneTxt').textContent = `${s.brand} · ${s.flavor}${s.sku ? ' · ' + s.sku : ''} · ${T('mfdShort')} ${dmy(s.mfd)}`;
    $('#done').classList.add('on');
    editId = null; oldThumb = '';
  } catch (err) { toast(T('saveErr') + err.message); }
  render();
};
$('#next').onclick = () => {
  $('#done').classList.remove('on');
  f = { ...blank(), buyerDept: f.buyerDept, buyerOther: f.buyerOther, buyDate: f.buyDate, market: f.market };
  view = 'form'; render(); scrollTo({ top: 0, behavior: 'smooth' });
};
$('#review').onclick = () => { $('#done').classList.remove('on'); startEdit(lastId); };
(async () => {
  render();
  try {
    const [c, s] = await Promise.all([api.get('catalog'), api.get('samples')]);
    if (!c.ok) throw new Error(c.error);
    products = c.products;
    samples = s.samples || [];
    loaded = true;
  } catch (err) { loadErr = err.message; }
  render();
})();
</script>
</body>
</html>
